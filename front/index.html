<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Películas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="auth-section">
    <h2>Login / Registro</h2>
    <form id="form-auth">
        <input type="email" id="email" placeholder="Correo electrónico" required>
        <input type="password" id="password" placeholder="Contraseña" required>
        <select id="role-select">
            <option value="USER">Usuario Normal</option>
            <option value="ADMIN">Administrador</option>
        </select>
        <button type="button" onclick="login()">Iniciar Sesión</button>
        <button type="button" onclick="register()">Registrarse</button>
    </form>
    <p id="auth-message"></p>
    <button id="btn-logout" style="display: none;" onclick="logout()">Cerrar Sesión</button>
</div>
<hr>
        <h1>Gestor de Películas</h1>
        
        <form id="form-pelicula">
            <input type="hidden" id="pelicula-id">
            
            <input type="text" id="titulo" placeholder="Título de la película" required>
            
            <input type="number" id="año" placeholder="Año" min="1895" max="2026" required>
            
            <input type="number" id="generoId" placeholder="ID del Género (ej: 1)" min="1" required>
            
            <button type="submit" id="btn-submit">Agregar Película</button>
        </form>

        <div style="margin-top: 20px;">
            <input type="number" id="buscar-id" placeholder="Buscar por ID">
            <button id="btn-buscar">Buscar Película</button>
            <button id="btn-todas">Ver todas las peliculas</button>
        </div>

        <ul id="lista-peliculas"></ul>
        <hr>
        <div id="watchlist-section" style="display: none;">
            <h2>Mi Lista de Favoritos 🍿</h2>
            <ul id="lista-watchlist"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
