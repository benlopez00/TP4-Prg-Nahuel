<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CRUD Películas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gestor de Películas</h1>
        
        <form id="form-pelicula">
            <input type="text" id="titulo" placeholder="Título de la película" required>
            <input type="number" id="año" placeholder="Año" required>
            <input type="number" id="generoId" placeholder="ID del Género (ej: 1)" required>
            <button type="submit">Agregar Película</button>
        </form>

        <ul id="lista-peliculas"></ul>
    </div>

    <script src="app.js"></script>
</body>
</html>
